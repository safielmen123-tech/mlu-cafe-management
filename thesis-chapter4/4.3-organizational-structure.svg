  <text x="700" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#3d5a73">overall cafe management</text>

  <line x1="700" y1="230" x2="700" y2="320" stroke="#1f4e79" stroke-width="2.5"/>
