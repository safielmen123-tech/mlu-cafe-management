<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1580" viewBox="0 0 900 1580">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#222"/>
    </marker>
  </defs>
  <rect width="900" height="1580" fill="#ffffff"/>
  <text x="450" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#222">Flowchart Create User</text>
  <text x="450" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#555">Mlu Kitchen &amp; Cafe Siem Reap</text>

  <rect x="340" y="110" width="220" height="50" rx="25" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="450" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Start</text>
  <line x1="450" y1="160" x2="450" y2="200" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="200" width="360" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="450" y="234" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">Admin opens Users screen</text>
  <line x1="450" y1="256" x2="450" y2="296" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="270,296 630,296 590,360 230,360" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="450" y="328" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Enter name, username,</text>
  <text x="450" y="348" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">password, role, permissions</text>
  <line x1="450" y1="360" x2="450" y2="404" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="450,404 640,494 450,584 260,494" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="450" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">All required fields</text>
  <text x="450" y="506" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">filled?</text>

  <line x1="260" y1="494" x2="110" y2="494" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="482" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b85450">No</text>
  <rect x="20" y="540" width="180" height="70" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="110" y="568" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">Show error:</text>
  <text x="110" y="588" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">All boxes required</text>
  <line x1="110" y1="610" x2="110" y2="328" stroke="#222" stroke-width="1.6"/>
  <line x1="110" y1="328" x2="270" y2="328" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="450" y1="584" x2="450" y2="630" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d6a32">Yes</text>

  <polygon points="450,630 640,720 450,810 260,720" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="450" y="712" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Password at least</text>
  <text x="450" y="732" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">6 characters?</text>

  <line x1="640" y1="720" x2="790" y2="720" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="708" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b85450">No</text>
  <rect x="690" y="760" width="190" height="70" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="785" y="788" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">Show error:</text>
  <text x="785" y="808" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">Password min 6 chars</text>
  <line x1="785" y1="830" x2="785" y2="328" stroke="#222" stroke-width="1.6"/>
  <line x1="785" y1="328" x2="630" y2="328" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="450" y1="810" x2="450" y2="856" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="838" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d6a32">Yes</text>

  <rect x="270" y="856" width="360" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="450" y="890" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">Check username in database</text>
  <line x1="450" y1="912" x2="450" y2="956" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="450,956 640,1046 450,1136 260,1046" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="450" y="1038" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Username already</text>
  <text x="450" y="1058" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">taken?</text>

  <line x1="640" y1="1046" x2="790" y2="1046" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="1034" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b85450">Yes</text>
  <rect x="690" y="1086" width="190" height="70" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="785" y="1114" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">Show error:</text>
  <text x="785" y="1134" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">Username is taken</text>
  <line x1="785" y1="1156" x2="785" y2="1480" stroke="#222" stroke-width="1.6"/>
  <line x1="785" y1="1480" x2="450" y2="1480" stroke="#222" stroke-width="1.6"/>

  <line x1="450" y1="1136" x2="450" y2="1180" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="1162" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d6a32">No</text>

  <rect x="250" y="1180" width="400" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="450" y="1214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">Hash password and save user</text>
  <line x1="450" y1="1236" x2="450" y2="1276" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="1276" width="400" height="56" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="450" y="1310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">Show success message</text>
  <line x1="450" y1="1332" x2="450" y2="1480" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="1480" width="220" height="50" rx="25" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="450" y="1512" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">End</text>
</svg>
