  <text x="490" y="1456" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">Revenue, busy hours, restock hints</text>
  <line x1="490" y1="1474" x2="490" y2="1620" stroke="#222" stroke-width="2"/>
  <line x1="490" y1="1620" x2="490" y2="1648" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="1648" width="220" height="50" rx="25" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="490" y="1680" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">End</text>
