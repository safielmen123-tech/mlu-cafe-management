<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1520" viewBox="0 0 900 1520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#222"/>
    </marker>
  </defs>
  <rect width="900" height="1520" fill="#ffffff"/>
  <text x="450" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#222">Flowchart Payment</text>
  <text x="450" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#555">Mlu Kitchen &amp; Cafe Siem Reap</text>

  <rect x="340" y="110" width="220" height="50" rx="25" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="450" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Start</text>
  <line x1="450" y1="160" x2="450" y2="200" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="200" width="380" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="450" y="234" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">Open Payment screen</text>
  <line x1="450" y1="256" x2="450" y2="300" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="450,300 640,390 450,480 260,390" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="450" y="382" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Pending order</text>
  <text x="450" y="402" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">exists?</text>

  <line x1="260" y1="390" x2="110" y2="390" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="378" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b85450">No</text>
  <rect x="20" y="430" width="180" height="70" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="110" y="458" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">Show error:</text>
  <text x="110" y="478" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">No active ticket</text>
  <line x1="110" y1="500" x2="110" y2="1400" stroke="#222" stroke-width="1.6"/>
  <line x1="110" y1="1400" x2="450" y2="1400" stroke="#222" stroke-width="1.6"/>

  <line x1="450" y1="480" x2="450" y2="530" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d6a32">Yes</text>

  <polygon points="260,530 640,530 600,594 220,594" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="450" y="570" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">Choose Cash or Bank Scan</text>
  <line x1="450" y1="594" x2="450" y2="638" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="450,638 640,728 450,818 260,728" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="450" y="720" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Payment method</text>
  <text x="450" y="740" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">selected?</text>

  <line x1="640" y1="728" x2="790" y2="728" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="716" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b85450">No</text>
  <rect x="700" y="770" width="180" height="56" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="790" y="804" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">Select a method</text>
  <line x1="790" y1="770" x2="790" y2="562" stroke="#222" stroke-width="1.6"/>
  <line x1="790" y1="562" x2="640" y2="562" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="450" y1="818" x2="450" y2="868" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="848" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d6a32">Yes</text>

  <rect x="230" y="868" width="440" height="70" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="450" y="898" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">Mark order Completed</text>
  <text x="450" y="920" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">tax = 0, total = subtotal</text>
  <line x1="450" y1="938" x2="450" y2="978" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="978" width="440" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="450" y="1012" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">Write payment to audit log</text>
  <line x1="450" y1="1034" x2="450" y2="1074" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="1074" width="440" height="56" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="450" y="1108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">Show and print receipt</text>
  <line x1="450" y1="1130" x2="450" y2="1400" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="1400" width="220" height="50" rx="25" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="450" y="1432" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">End</text>
</svg>
