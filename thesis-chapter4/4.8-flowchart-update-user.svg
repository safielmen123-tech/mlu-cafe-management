<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1720" viewBox="0 0 980 1720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#222"/>
    </marker>
  </defs>
  <rect width="980" height="1720" fill="#ffffff"/>
  <text x="490" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#222">Flowchart Update User</text>
  <text x="490" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#555">Mlu Kitchen &amp; Cafe Siem Reap</text>

  <rect x="380" y="110" width="220" height="50" rx="25" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="490" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Start</text>
  <line x1="490" y1="160" x2="490" y2="200" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="200" width="380" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="490" y="234" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">Admin selects a user to edit</text>
  <line x1="490" y1="256" x2="490" y2="296" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="300,296 680,296 640,360 260,360" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="490" y="328" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Edit name, role, permissions</text>
  <text x="490" y="348" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">(password optional)</text>
  <line x1="490" y1="360" x2="490" y2="404" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="490,404 680,494 490,584 300,494" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="490" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Name and role</text>
  <text x="490" y="506" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">filled?</text>

  <line x1="300" y1="494" x2="140" y2="494" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="482" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b85450">No</text>
  <rect x="40" y="540" width="200" height="70" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="140" y="568" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">Show error:</text>
  <text x="140" y="588" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">Name and role required</text>
  <line x1="140" y1="610" x2="140" y2="328" stroke="#222" stroke-width="1.6"/>
  <line x1="140" y1="328" x2="300" y2="328" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="490" y1="584" x2="490" y2="630" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d6a32">Yes</text>

  <rect x="310" y="630" width="360" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="490" y="664" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">Find user in database</text>
  <line x1="490" y1="686" x2="490" y2="730" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="490,730 680,820 490,910 300,820" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="490" y="816" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">User found?</text>

  <line x1="680" y1="820" x2="840" y2="820" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="755" y="808" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b85450">No</text>
  <rect x="750" y="860" width="190" height="60" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="845" y="896" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">User not found</text>
  <line x1="845" y1="920" x2="845" y2="1620" stroke="#222" stroke-width="1.6"/>
  <line x1="845" y1="1620" x2="490" y2="1620" stroke="#222" stroke-width="1.6"/>

  <line x1="490" y1="910" x2="490" y2="956" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="938" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d6a32">Yes</text>

  <polygon points="490,956 700,1050 490,1144 280,1050" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="490" y="1042" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">New password</text>
  <text x="490" y="1062" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">entered?</text>

  <!-- Yes password: right then down -->
  <line x1="700" y1="1050" x2="820" y2="1050" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="1038" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d6a32">Yes</text>
  <polygon points="820,1100 930,1160 820,1220 710,1160" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="820" y="1156" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">Password</text>
  <text x="820" y="1174" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">&gt;= 6 chars?</text>
  <line x1="820" y1="1100" x2="820" y2="1050" stroke="#222" stroke-width="2"/>

  <line x1="930" y1="1160" x2="930" y2="1240" stroke="#222" stroke-width="2"/>
  <text x="942" y="1200" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#b85450">No</text>
  <rect x="840" y="1240" width="130" height="56" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="905" y="1274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">Min 6 chars</text>
  <line x1="905" y1="1296" x2="905" y2="328" stroke="#222" stroke-width="1.5"/>
  <line x1="905" y1="328" x2="680" y2="328" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="820" y1="1220" x2="820" y2="1360" stroke="#222" stroke-width="2"/>
  <line x1="820" y1="1360" x2="490" y2="1360" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="1350" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2d6a32">Yes: hash password</text>

  <!-- No new password: down -->
  <line x1="490" y1="1144" x2="490" y2="1360" stroke="#222" stroke-width="2"/>
  <text x="510" y="1260" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b85450">No</text>
  <text x="510" y="1278" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555">keep old password</text>

  <rect x="270" y="1360" width="440" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="490" y="1394" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">Save updated user to database</text>
  <line x1="490" y1="1416" x2="490" y2="1456" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="1456" width="440" height="56" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="490" y="1490" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14">Show success message</text>
  <line x1="490" y1="1512" x2="490" y2="1620" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="1620" width="220" height="50" rx="25" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="490" y="1652" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">End</text>
</svg>
